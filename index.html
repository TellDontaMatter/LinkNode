<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LinkNode Graph</title>
  <script src="https://unpkg.com/force-graph"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #0a1a08; overflow: hidden; }
    #graph { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="graph"></div>
  <script>
    const COLORS = [
      '#e63946', // classic red
      '#e9c46a', // gold
      '#4cc9f0', // ice blue
      '#c77dff', // purple
      '#f4a261', // copper
      '#a8dadc', // silver
      '#ff6b6b', // coral
      '#2a9d8f', // teal
    ];

    function shade(hex, pct) {
      const n = parseInt(hex.replace('#',''), 16);
      const a = Math.round(2.55 * pct);
      const r = Math.min(255, Math.max(0, (n >> 16) + a));
      const g = Math.min(255, Math.max(0, (n >> 8 & 0xff) + a));
      const b = Math.min(255, Math.max(0, (n & 0xff) + a));
      return '#' + (0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
    }

    fetch('output/graph.json')
      .then(res => res.json())
      .then(data => {
        data.nodes.forEach((node, i) => {
          node._c = COLORS[i % COLORS.length];
        });

        ForceGraph()(document.getElementById('graph'))
          .backgroundColor('#0a1a08')
          .graphData(data)
          .nodeId('id')
          .nodeLabel('id')
          .linkColor(() => 'rgba(255, 215, 0, 0.35)')
          .linkWidth(1.5)
          .linkCurvature(0.15)
          .linkDirectionalArrowLength(0)
          .nodeCanvasObject((node, ctx, gs) => {
            const R = 11;
            const x = node.x, y = node.y;

            // glow
            ctx.shadowColor = node._c;
            ctx.shadowBlur = 18;

            // ornament body with shine gradient
            const grad = ctx.createRadialGradient(x - R*0.35, y - R*0.35, R*0.08, x, y, R);
            grad.addColorStop(0, 'rgba(255,255,255,0.75)');
            grad.addColorStop(0.25, node._c);
            grad.addColorStop(1, shade(node._c, -55));
            ctx.beginPath();
            ctx.arc(x, y, R, 0, 2*Math.PI);
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.shadowBlur = 0;

            // cap
            ctx.fillStyle = '#c9a84c';
            ctx.fillRect(x - 3, y - R - 6, 6, 6);

            // hook
            ctx.strokeStyle = 'rgba(220, 190, 80, 0.7)';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(x, y - R - 6);
            ctx.bezierCurveTo(x, y - R - 14, x + 7, y - R - 14, x + 7, y - R - 10);
            ctx.stroke();

            // label
            const fs = Math.max(9, 11 / gs);
            ctx.font = `${fs}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillStyle = 'rgba(255,245,210,0.9)';
            ctx.fillText(node.id, x, y + R + 3);
          })
          .nodePointerAreaPaint((node, color, ctx) => {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(node.x, node.y, 13, 0, 2*Math.PI);
            ctx.fill();
          });
      });
  </script>
</body>
</html>

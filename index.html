<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LinkNode Graph</title>
  <script src="https://unpkg.com/force-graph"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; }
    #graph { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="graph"></div>
  <script>
    fetch('output/graph.json')
      .then(res => res.json())
      .then(data => {
        ForceGraph()(document.getElementById('graph'))
          .graphData(data)
          .nodeId('id')
          .nodeAutoColorBy('group')
          .nodeLabel('id') // Keeps the tooltip active on hover
          .linkDirectionalArrowLength(4)
          .linkColor(() => 'rgba(255,255,255,0.25)')
          // --- Add this block for permanent text labels ---
          .nodeCanvasObject((node, ctx, globalScale) => {
            const label = node.id;
            const fontSize = 12/globalScale;
            ctx.font = `${fontSize}px Sans-Serif`;
            
            // Draw the node circle
            ctx.beginPath();
            ctx.arc(node.x, node.y, 4, 0, 2 * Math.PI, false);
            ctx.fillStyle = node.color || '#ff6b6b';
            ctx.fill();

            // Draw the text label next to the node
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fillText(label, node.x + 6, node.y);
          })
          .nodePointerAreaPaint((node, color, ctx) => {
            // Expands the clickable/hoverable area around the small node circle
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(node.x, node.y, 6, 0, 2 * Math.PI, false);
            ctx.fill();
          });
      });
  </script>
</body>
</html>
